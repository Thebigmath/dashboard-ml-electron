<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conciliação — Dashboard ML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        body { opacity:0; transition:opacity .38s cubic-bezier(.22,1,.36,1); }
        body.page-ready { opacity:1; }
        .cc { padding:24px 28px 50px; width:100%; box-sizing:border-box; overflow-y:auto; height:100vh; }
        .cc h1 { font-size:24px; font-weight:700; color:var(--l1); margin:0; }
        .cc .sub { color:var(--l3); font-size:13px; margin:4px 0 14px; max-width:1000px; }
        .barra { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
        .in, .sel { background:var(--s2); border:1px solid var(--sep); color:var(--l1); border-radius:9px; padding:7px 10px; font-size:13px; }
        .bt { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:9px; border:1px solid var(--sep); background:var(--s2); color:var(--l1); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
        .bt.pri { background:#0a84ff; color:#fff; border-color:transparent; } .bt.ia { background:#bf5af2; color:#fff; border-color:transparent; } .bt:disabled { opacity:.5; cursor:not-allowed; }
        .box { background:var(--s1); border:1px solid var(--sep); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
        .box h3 { font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--l3); margin:0 0 10px; font-weight:700; }
        .escada { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
        .degrau { border-radius:12px; padding:12px 14px; background:var(--s2); border:1px solid var(--sep); }
        .degrau small { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
        .degrau b { display:block; font-size:24px; color:var(--l1); margin:2px 0; font-variant-numeric:tabular-nums; }
        .degrau span { font-size:12px; color:var(--l3); }
        .trilhas { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
        .tr { background:var(--s2); border:1px solid var(--sep); border-radius:12px; padding:12px 14px; cursor:pointer; }
        .tr.ativo { border-color:#0a84ff; box-shadow:0 0 0 1px #0a84ff inset; }
        .tr b { color:var(--l1); font-size:14px; }
        .barrinha { display:flex; height:7px; border-radius:99px; overflow:hidden; margin:8px 0 6px; background:var(--sep); }
        .leg { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--l3); }
        .leg i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
        .mot { font-size:12px; color:var(--l2); margin-top:6px; }
        table { width:100%; border-collapse:collapse; font-size:12.5px; }
        th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--l3); padding:7px 8px; border-bottom:1px solid var(--sep); position:sticky; top:0; background:var(--s1); }
        td { padding:7px 8px; border-bottom:1px solid rgba(128,128,128,.10); color:var(--l1); vertical-align:top; }
        td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
        .pill { font-size:11px; font-weight:600; border-radius:999px; padding:2px 8px; white-space:nowrap; }
        .ok { background:color-mix(in srgb,#30D158 16%,transparent); color:#30D158; } .ag { background:color-mix(in srgb,#ff9f0a 16%,transparent); color:#ff9f0a; }
        .dv { background:color-mix(in srgb,#ff453a 16%,transparent); color:#ff453a; } .fo { background:var(--s2); color:var(--l3); }
        .f { color:var(--l3); font-size:12px; }
        .ia-g { border-left:3px solid #bf5af2; padding:8px 12px; margin:8px 0; background:var(--s2); border-radius:0 10px 10px 0; }
        .ia-g b { color:var(--l1); } .ia-g div { font-size:12.5px; color:var(--l2); margin-top:3px; }
        @media (max-width:900px) { .escada { grid-template-columns:1fr; } }
    </style>
<script src="/assets/js/shell.js"></script>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div class="aurora"><div class="aur-1"></div><div class="aur-2"></div><div class="aur-3"></div></div>
<div class="d-flex"><main class="content"><div class="cc">
    <h1><i class="bi bi-check2-all"></i> Conciliação</h1>
    <div class="sub">O que o <b>Mercado Livre</b> diz que a loja recebe em cada pedido (venda − cupom − tarifa − frete) × o líquido que de fato <b>caiu no Mercado Pago</b>, pedido a pedido. Só leitura: nada é alterado nas plataformas.</div>

    <div class="barra">
        <select class="sel" id="periodo" onchange="carregar()">
            <option value="7">Últimos 7 dias</option><option value="15">Últimos 15 dias</option><option value="30">Últimos 30 dias</option><option value="45" selected>Últimos 45 dias</option><option value="60">Últimos 60 dias</option><option value="mes">Esse mês</option><option value="mes_passado">Mês passado</option><option value="ontem">Ontem</option>
        </select>
        <select class="sel" id="fSit" onchange="tabela()"><option value="">Todas as situações</option><option value="caiu">Já caiu no MP (bate ou diferença)</option><option value="dif">Com diferença</option><option value="ok">Batem</option><option value="exp">Diferença explicada</option><option value="fr">Frete ajustado pelo ML</option><option value="ag">A liberar (não entregue)</option><option value="dev">Devolvidos</option></select>
        <input class="in" id="busca" placeholder="Buscar pedido ou SKU…" oninput="tabela()" style="min-width:200px">
        <span style="margin-left:auto"></span>
        <button class="bt" onclick="exportar()"><i class="bi bi-download"></i> Exportar</button>
        <button class="bt" onclick="atualizar()" id="btAtualizar"><i class="bi bi-arrow-repeat"></i> Atualizar dados (ML e MP)</button>
    </div>
    <div class="f" id="estado" style="margin:-6px 0 10px"></div>
    <div class="f" id="conta" style="margin:0 0 8px"></div>
    <div class="box"><div style="max-height:640px;overflow:auto"><table id="tab"></table></div></div>
</div></main></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dia = (d) => d.toISOString().slice(0, 10);
const PILL = { ok: ['ok', 'ok'], conciliado: ['ok', 'conciliado'], aguardando: ['ag', 'aguardando'], divergente: ['dv', 'divergente'], fora: ['fo', 'fora'] };
const pill = (s) => `<span class="pill ${PILL[s][0]}">${PILL[s][1]}</span>`;
let D = null, timer = null;

function intervalo() {
    const p = $('periodo').value, h = new Date(Date.now() - 3 * 3600000), d = (n) => { const x = new Date(h); x.setUTCDate(x.getUTCDate() + n); return x; };
    if (p === 'ontem') return [dia(d(-1)), dia(d(-1))];
    if (p === 'mes') return [dia(h).slice(0, 8) + '01', dia(h)];
    if (p === 'mes_passado') { const ini = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth() - 1, 1)), fim = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth(), 0)); return [dia(ini), dia(fim)]; }
    return [dia(d(-(Number(p) - 1))), dia(h)];
}
async function carregar() {
    const [de, ate] = intervalo();
    const r = await fetch(`/api/finance/conciliacao?de=${de}&ate=${ate}`).then(x => x.json());
    if (r.erro) { $('conta').innerHTML = `<span style="color:#ff453a">${esc(r.erro)}</span>`; return; }
    D = r; desenhar(); acompanhar();
}
function situacao(l) { return l.status_pedido === 'Devolvido' ? 'dev' : !l.liberado ? 'ag' : Math.abs(l.diferenca) <= 0.1 ? 'ok' : l.explicado ? 'exp' : l.causa && l.causa.so_frete ? 'fr' : 'dif'; }
const SIT = { ok: ['ok', 'bate'], exp: ['ag', 'explicada'], fr: ['ag', 'frete ajustado'], dif: ['dv', 'diferença'], ag: ['ag', 'a liberar'], dev: ['fo', 'devolvido'] };
function tabela() {
    if (!D) return;
    const f = $('fSit').value, q = ($('busca').value || '').trim().toLowerCase();
    const L = D.linhas.filter(l => (!f || (f === 'caiu' ? ['ok', 'exp', 'fr', 'dif'].includes(situacao(l)) : situacao(l) === f)) && (!q || (l.id + ' ' + l.produtos).toLowerCase().includes(q)))
        .sort((a, b) => Math.abs(b.diferenca || 0) - Math.abs(a.diferenca || 0) || String(b.dia).localeCompare(String(a.dia)));
    const n = (k) => D.linhas.filter(l => situacao(l) === k).length;
    const soma = (k) => D.linhas.filter(l => situacao(l) === k).reduce((s, l) => s + (l.diferenca || 0), 0);
    $('conta').innerHTML = `${D.linhas.length} pedidos · ${n('ok')} batem · ${n('exp')} com diferença explicada (${brl(soma('exp'))}) · ${n('fr')} com frete ajustado (${brl(soma('fr'))}) · <b style="color:#ff453a">${n('dif')} com diferença (${brl(soma('dif'))})</b> · ${n('ag')} a liberar (ainda não caiu no MP) · ${n('dev')} devolvidos${L.length !== D.linhas.length ? ` · mostrando ${L.length}` : ''}`;
    $('tab').innerHTML = `<thead><tr><th>Pedido</th><th>Data</th><th>Envio</th><th style="text-align:right">Venda</th><th style="text-align:right">Recebido no ML</th><th style="text-align:right">Caiu no MP</th><th style="text-align:right">Diferença</th><th>Situação</th></tr></thead><tbody>`
        + L.slice(0, 600).map(l => { const s = situacao(l), m = l.trilhas && l.trilhas.mp;
            return `<tr><td><b>${l.id}</b><div class="f">${esc(l.produtos)}</div></td><td>${l.dia.split('-').reverse().join('/')}</td><td>${esc(l.envio || '—')}</td>
                <td style="text-align:right">${brl(l.venda)}</td><td style="text-align:right">${brl(l.esperado)}</td><td style="text-align:right">${l.liberado ? brl(l.recebido) : `<span class="f">—</span>`}</td>
                <td style="text-align:right;color:${s === 'dif' ? '#ff453a' : 'inherit'}">${l.diferenca == null ? '—' : brl(l.diferenca)}</td>
                <td><span class="pill ${SIT[s][0]}">${SIT[s][1]}</span>${s === 'ag' && l.previsto != null ? `<div class="f">MP prevê ${brl(l.previsto)}${l.libera_em ? ' · libera em ' + l.libera_em.slice(0, 10).split('-').reverse().join('/') : ''}</div>` : ''}${s === 'exp' ? `<div class="f">${esc(l.explicado)}</div>` : (s === 'fr' || s === 'dif') && l.causa && l.causa.partes.length ? `<div class="f">${l.causa.partes.map(x => esc(x.txt)).join('<br>')}${l.causa.sem_explicacao ? `<br>Sem explicação: ${brl(l.causa.sem_explicacao)}` : ''}</div>` : s === 'dif' && l.comparativo ? `<div class="f">Tarifa: ML ${brl(l.comparativo.tarifa_ml)} × MP ${brl(l.comparativo.tarifa_mp)}<br>Frete: ML ${brl(l.comparativo.frete_ml)} × MP ${brl(l.comparativo.frete_mp)}${l.comparativo.cupom_mp ? ` · cupom no MP ${brl(l.comparativo.cupom_mp)}` : ''}</div>` : ''}</td></tr>`; }).join('')
        + (L.length > 600 ? `<tr><td colspan="8" class="f">mostrando os 600 primeiros de ${L.length}</td></tr>` : '') + '</tbody>';
}
function desenhar() { tabela(); }
function exportar() {
    if (!D) return;
    const csv = ['Pedido;Data;Envio;Produtos;Venda;Recebido no ML;Caiu no MP;Diferença;Situação'].concat(D.linhas.map(l => [l.id, l.dia, l.envio || '', String(l.produtos || '').replace(/;/g, ','),
        ...[l.venda, l.esperado, l.recebido, l.diferenca].map(v => v == null ? '' : String(v).replace('.', ',')), SIT[situacao(l)][1]].join(';'))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' })); a.download = `conciliacao_${intervalo().join('_a_')}.csv`; a.click();
}
async function atualizar() {
    const [de, ate] = intervalo();
    const r = await fetch('/api/finance/planilha/atualizar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ de, ate }) }).then(x => x.json());
    if (!r.ok) alert(r.erro || 'não deu');
    acompanhar();
}
async function acompanhar() {
    let e; try { e = await fetch('/api/finance/planilha/estado').then(x => x.json()); } catch { return; }
    const rod = e.rodando || e.finance.rodando, fz = e.mes === 'notas' ? e.fiscal : e.finance;
    $('btAtualizar').disabled = rod;
    $('estado').innerHTML = rod ? `<i class="bi bi-hourglass-split"></i> ${e.mes === 'notas' ? 'Notas fiscais no Olist' : 'Pedidos, envios e pagamentos (ML e MP)'}: ${esc(fz.etapa || '…')}${fz.total ? ` ${fz.feito} de ${fz.total}` : ''}` : e.erro ? `<span style="color:#ff453a">Erro: ${esc(e.erro)}</span>` : e.aviso ? `<span style="color:#ff9f0a">${esc(e.aviso)}</span>` : '';
    if (rod) { $('estado').dataset.r = '1'; setTimeout(acompanhar, 3000); } else if ($('estado').dataset.r === '1') { $('estado').dataset.r = ''; carregar(); }
}
carregar();
document.body.classList.add('page-ready');
</script>
<script src="/assets/js/sidebar.js"></script>
</body>
</html>
