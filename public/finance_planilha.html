<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha avançada — Dashboard ML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        body { opacity:0; transition:opacity .38s cubic-bezier(.22,1,.36,1); }
        body.page-ready { opacity:1; }
        .pa { padding:24px 28px 50px; width:100%; box-sizing:border-box; overflow-y:auto; height:100vh; }
        .pa h1 { font-size:24px; font-weight:700; color:var(--l1); margin:0; }
        .pa .sub { color:var(--l3); font-size:13px; margin:4px 0 14px; }
        .barra { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
        .in, .sel { background:var(--s2); border:1px solid var(--sep); color:var(--l1); border-radius:9px; padding:7px 10px; font-size:13px; }
        .bt { display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:9px; border:1px solid var(--sep); background:var(--s2); color:var(--l1); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
        .bt.pri { background:#0a84ff; color:#fff; border-color:transparent; } .bt:disabled { opacity:.5; cursor:not-allowed; }
        .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:12px; }
        .card2 { background:var(--s1); border:1px solid var(--sep); border-radius:12px; padding:12px 14px; }
        .card2 small { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--l3); }
        .card2 b { display:block; font-size:21px; color:var(--l1); margin-top:3px; font-variant-numeric:tabular-nums; }
        .card2 span { font-size:12px; color:var(--l3); }
        .tabela { background:var(--s1); border:1px solid var(--sep); border-radius:14px; overflow:auto; max-height:calc(100vh - 330px); min-height:300px; }
        table { border-collapse:separate; border-spacing:0; font-size:12.5px; width:max-content; min-width:100%; }
        th { position:sticky; top:0; z-index:2; background:var(--s1); text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--l3); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--sep); white-space:nowrap; cursor:pointer; }
        th.t, td.t { text-align:left; }
        td { padding:7px 10px; border-bottom:1px solid rgba(128,128,128,.10); color:var(--l1); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
        tr.tot td { position:sticky; top:31px; z-index:1; background:var(--s2); font-weight:700; border-bottom:1px solid var(--sep); }
        td.neg { color:#ff453a; } td.pos { color:#30D158; } td.dest { font-weight:700; }
        td.prod { white-space:normal; min-width:240px; max-width:320px; text-align:left; }
        .f { color:var(--l3); font-size:11.5px; }
        .pill { font-size:11px; font-weight:600; border-radius:999px; padding:2px 8px; background:var(--s2); color:var(--l2); }
        .pill.dev { background:color-mix(in srgb,#ff453a 16%,transparent); color:#ff453a; }
        .pag { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; font-size:12.5px; color:var(--l3); }
        .cols { position:absolute; z-index:50; background:var(--s1); border:1px solid var(--sep); border-radius:12px; padding:10px 12px; box-shadow:0 18px 50px rgba(0,0,0,.35); max-height:60vh; overflow:auto; }
        .cols label { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--l2); padding:3px 0; cursor:pointer; }
    </style>
<script src="/assets/js/shell.js"></script>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div class="aurora"><div class="aur-1"></div><div class="aur-2"></div><div class="aur-3"></div></div>
<div class="d-flex"><main class="content"><div class="pa">
    <h1><i class="bi bi-table"></i> Planilha avançada</h1>
    <div class="sub">Análise de vendas pedido a pedido, com os pedidos do Mercado Livre desta conta. Valor líquido = base + comissão + diferença do frete − imposto · Margem = líquido − custo. <span id="atualizado"></span></div>

    <div class="barra">
        <select class="sel" id="periodo" onchange="mudarPeriodo()">
            <option value="hoje">Hoje</option><option value="ontem">Ontem</option><option value="semana" selected>Essa semana</option><option value="semana_passada">Última semana</option>
            <option value="mes">Esse mês</option><option value="30">Últimos 30 dias</option><option value="mes_passado">Mês passado</option><option value="ano">Esse ano</option><option value="ano_passado">Último ano</option><option value="custom">Escolher datas…</option>
        </select>
        <input type="date" class="in" id="de" onchange="periodoCustom()" hidden> <input type="date" class="in" id="ate" onchange="periodoCustom()" hidden>
        <select class="sel" id="campo"><option value="search">Buscar nos pedidos</option><option value="sku">Buscar por SKU</option><option value="productName">Buscar por nome do produto</option></select>
        <input class="in" id="busca" placeholder="Digite para buscar…" style="min-width:220px" oninput="pagina=1;desenhar()">
        <select class="sel" id="regime" onchange="mudarRegime()" title="Regime tributário"><option value="auto">Regime: o da conta</option><option value="real">Simular: Lucro Real no período todo</option><option value="simples">Forçar: Simples Nacional</option></select>
        <select class="sel" id="cenario" onchange="carregar()" hidden title="ICMS no Lucro Real"><option value="st">ICMS: produto com ST (como nas notas de hoje)</option><option value="normal">ICMS: normal, sem ST</option></select>
        <select class="sel" id="base" onchange="carregar()" title="Base da margem"><option value="produtos">Base: valor dos produtos</option><option value="pedido">Base: valor do pedido total</option></select>
        <select class="sel" id="fStatus" onchange="pagina=1;desenhar()"><option value="">Todos os status</option></select>
        <select class="sel" id="fEnvio" onchange="pagina=1;desenhar()"><option value="">Todos os envios</option></select>
        <span style="margin-left:auto"></span>
        <span style="position:relative"><button class="bt" onclick="abrirColunas(event)"><i class="bi bi-layout-three-columns"></i> Colunas</button><div class="cols" id="cols" hidden></div></span>
        <label class="bt" title="Planilha 'Base tributária' do contador (.xlsm/.xlsx): regras fiscais por SKU e por estado"><i class="bi bi-file-earmark-ruled"></i> Base tributária<input type="file" accept=".xlsm,.xlsx" hidden onchange="importarBase(this)"></label>
        <span class="bt" style="cursor:default" title="Valor por pedido (R$), descontado do Valor líquido">Brinde R$ <input class="in" id="cfgBrinde" type="number" min="0" step="0.01" style="width:70px;padding:3px 6px" onchange="salvarCustosPedido()"> Embalagem R$ <input class="in" id="cfgEmb" type="number" min="0" step="0.01" style="width:70px;padding:3px 6px" onchange="salvarCustosPedido()"></span>
        <button class="bt" onclick="exportar()"><i class="bi bi-download"></i> Exportar</button>
        <button class="bt pri" id="btAtualizar" onclick="atualizar()"><i class="bi bi-arrow-repeat"></i> Atualizar do Mercado Livre</button>
    </div>
    <div class="f" id="estado" style="margin:-4px 0 10px"></div>
    <div class="f" id="baseTrib" style="margin:-6px 0 10px"></div>
    <div id="simul"></div>
    <div id="cfgFiscal" hidden></div>
    <div class="cards" id="cards"></div>
    <div class="tabela"><table id="tab"></table></div>
    <div class="pag" id="pag"></div>
</div></main></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (v) => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => v == null ? '—' : Number(v).toFixed(2).replace('.', ',') + '%';
const dia = (d) => d.toISOString().slice(0, 10);
const hojeBR = () => new Date(Date.now() - 3 * 3600000);
// colunas (mesma ordem e nomes da Planilha avançada)
const COLS = [
    ['date', 'Data', 't'], ['requestNumberEcommerce', 'Nº do pedido', 't'], ['invoiceNumberWithSerie', 'Nº da NF-e', 't'], ['ecommerceNumber', 'Nº no canal (pacote)', 't'],
    ['client', 'Cliente', 't'], ['salesChannel', 'Canal de venda', 't'], ['city', 'Cidade', 't'], ['state', 'UF', 't'], ['shippingMethod', 'Envio', 't'], ['status', 'Status', 't'], ['products', 'Produtos', 't'],
    ['totalCost', 'Total custo', 'm'],
    ['creditIpi', 'Créd. IPI', 'm', 1], ['creditPis', 'Créd. PIS', 'm', 1], ['creditCofins', 'Créd. COFINS', 'm', 1], ['creditIcms', 'Créd. ICMS', 'm', 1], ['creditSt', 'Créd. ST', 'm', 1], ['creditDifal', 'Créd. DIFAL', 'm', 1], ['creditTotal', 'Créd. TOTAL', 'm', 1],
    ['valueWithoutDiscount', 'Valor do prod. vendido', 'm'], ['salesDiscount', 'Desconto', 'm'], ['devolucao', 'Devolução', 'm', 1],
    ['valueWithDiscount', 'Total prod. vendidos', 'm'], ['receivedFreight', 'Frete recebido', 'm'], ['saleSt', 'ST da venda', 'm'], ['saleIpi', 'IPI da venda', 'm'],
    ['totalSale', 'Total venda', 'm', 0, 1], ['financialTransfer', 'Repasse', 'm', 0, 1],
    ['allCommissionValue', 'Comissão', 'm'], ['rebateCommissionValue', 'Rebate comissão', 'm'], ['commission', 'Comissão final', 'm'], ['bonusValue', 'Bônus', 'm'],
    ['paidFreight', 'Frete pago', 'm'], ['shippingRebate', 'Rebate do frete', 'm'], ['freightDifference', 'Diferença do frete', 'm'],
    ['debitIpi', 'Déb. IPI', 'm'], ['debitPis', 'Déb. PIS', 'm'], ['debitCofins', 'Déb. COFINS', 'm'], ['debitIcms', 'Déb. ICMS', 'm'], ['debitSt', 'Déb. ST', 'm'], ['debitDifal', 'Déb. DIFAL', 'm'],
    ['debitTotal', 'Déb. TOTAL', 'm', 0, 1], ['simplesDas', 'Simples (IRPJ+CSLL+CPP)', 'm'], ['importTax', 'Imp. importação', 'm', 1], ['tax', 'Imposto', 'm'],
    ['gift', 'Brinde', 'm'], ['package', 'Embalagem', 'm'],
    ['liquidValue', 'Valor líquido', 'm', 0, 1], ['margin', 'Margem', 'm', 0, 1], ['costPercentage', '% Custo', 'p'], ['salePercentage', '% Venda', 'p'],
];
let ocultas = (() => { try { return new Set(JSON.parse(localStorage.getItem('pa_ocultas4') || 'null') || COLS.filter(c => c[3]).map(c => c[0])); } catch { return new Set(COLS.filter(c => c[3]).map(c => c[0])); } })();
let D = null, pagina = 1, ordem = { k: 'date', desc: true }, timer = null;
const POR = 100;

function intervalo() {
    const p = $('periodo').value, h = hojeBR(), d = (n) => { const x = new Date(h); x.setUTCDate(x.getUTCDate() + n); return x; };
    if (p === 'hoje') return [dia(h), dia(h)];
    if (p === 'ontem') return [dia(d(-1)), dia(d(-1))];
    if (p === 'semana') return [dia(d(-7)), dia(h)];
    if (p === 'semana_passada') return [dia(d(-14)), dia(d(-7))];
    if (p === 'mes') return [dia(h).slice(0, 8) + '01', dia(h)];
    if (p === 'ano') return [dia(d(-365)), dia(h)];
    if (p === 'ano_passado') { const a = h.getUTCFullYear() - 1; return [`${a}-01-01`, `${a}-12-31`]; }
    if (p === '30') return [dia(d(-30)), dia(h)];
    if (p === 'mes_passado') { const a = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth() - 1, 1)), b = new Date(Date.UTC(h.getUTCFullYear(), h.getUTCMonth(), 0)); return [dia(a), dia(b)]; }
    return [$('de').value || dia(d(-7)), $('ate').value || dia(h)];
}
function mudarPeriodo() { const c = $('periodo').value === 'custom'; $('de').hidden = $('ate').hidden = !c; if (c) { const [a, b] = intervalo(); $('de').value = a; $('ate').value = b; } try { localStorage.setItem('pa_periodo', $('periodo').value); } catch {} carregar(); }
function periodoCustom() { carregar(); }
function mudarRegime() { $('cenario').hidden = $('regime').value !== 'real'; carregar(); }
// Lucro Real (o da conta ou simulado): mostra o jogo fiscal completo (debitos e creditos). Simples: ficam os debitos
// visiveis (como no GeFinance) e os creditos voltam a ficar ocultos.
function colunasFiscais() {
    const real = D && D.regime !== 'simples';
    for (const k of ['debitIpi', 'debitPis', 'debitCofins', 'debitIcms', 'debitSt', 'debitDifal', 'debitTotal', 'creditIpi', 'creditPis', 'creditCofins', 'creditIcms', 'creditSt', 'creditDifal', 'creditTotal']) real ? ocultas.delete(k) : (COLS.find(c => c[0] === k)[3] && ocultas.add(k));
}
function desenharSimulacao() {
    const L = D.lucro_real; if (!L) { $('simul').innerHTML = ''; return; }
    const dif = L.lucro_depois_ir - L.simples.margin, t = D.totais;
    $('simul').innerHTML = `<div class="card2" style="margin-bottom:12px;border-color:${L.oficial ? '#0a84ff' : '#bf5af2'}">
        <small style="color:${L.oficial ? '#0a84ff' : '#bf5af2'}">${L.oficial ? `<i class="bi bi-bank"></i> Lucro Real · regime da conta desde ${L.desde.split('-').reverse().join('/')} · ${L.pedidos} pedidos · regras da Base tributária por produto e por estado` : `<i class="bi bi-flask"></i> Simulação · Lucro Real · ${L.opcoes.cenario === 'st' ? 'produtos com ICMS-ST' : 'ICMS normal, sem ST'} · ${L.dias} dias`}</small>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px">
            <div><span>Simples hoje (DAS)</span><b>${brl(L.simples.margin)}</b><span>imposto ${brl(L.simples.tax)}</span></div>
            <div><span>Lucro Real: impostos do pedido</span><b>${brl(t.tax)}</b><span>débitos ${brl(t.debitTotal)} − créditos ${brl(t.creditTotal)}</span></div>
            <div><span>PIS + COFINS / ICMS / DIFAL</span><b style="font-size:16px">${brl(t.debitPis + t.debitCofins)} · ${brl(t.debitIcms)} · ${brl(t.debitDifal)}</b><span>créditos PIS/COFINS ${brl(t.creditPis + t.creditCofins)}</span></div>
            <div><span>IRPJ + CSLL (sobre a margem)</span><b>${brl(L.irpj + L.csll)}</b><span>margem antes ${brl(L.lucro_antes_ir)}</span></div>
            <div><span>Lucro Real: sobra</span><b style="color:${dif < 0 ? '#ff453a' : '#30D158'}">${brl(L.lucro_depois_ir)}</b><span>${dif < 0 ? 'pior' : 'melhor'} que o Simples em ${brl(Math.abs(dif))}</span></div>
        </div>
        <div class="f" style="margin-top:8px">${L.oficial ? 'Regras da Base tributária do contador: por SKU (ST, monofásico, PIS/COFINS, origem) e por estado de destino (alíquota interna, interestadual e DIFAL). SKU sem regra usa o caso geral (ICMS próprio, PIS 1,65% + COFINS 7,6% não cumulativos). Crédito de ICMS: o da nota de compra quando lida; sem ela, 12% do custo. IRPJ/CSLL é estimativa sobre a margem (ADS e custos fixos reduziriam). Conferir com o contador.' : ''}</div>
        <div class="f" style="margin-top:8px" ${L.oficial ? 'hidden' : ''}>Alíquotas gerais (PIS 1,65% e COFINS 7,6% não cumulativos, com crédito sobre custo e frete; ICMS de SP; DIFAL pela alíquota interna do destino; IRPJ 15% + 10% acima de R$ 20 mil/mês e CSLL 9%). ADS e custos fixos não entram aqui e reduziriam o IRPJ/CSLL. É simulação para decidir: conferir com o contador.</div></div>`;
}

async function carregar() {
    const [de, ate] = intervalo();
    try {
        const reg = $('regime').value, op = encodeURIComponent(JSON.stringify(reg === 'real' ? { cenario: $('cenario').value } : {}));
        const r = await fetch(`/api/finance/planilha?de=${de}&ate=${ate}&base=${$('base').value}&regime=${reg}&opcoes=${op}`).then(x => x.json());
        if (r.erro) throw new Error(r.erro);
        D = r;
    } catch (e) { $('tab').innerHTML = `<tr><td class="t" style="color:#ff453a">${esc(e.message)}</td></tr>`; return; }
    const falta = D.meses.filter(m => !m.coletado), velho = D.meses.filter(m => m.coletado && m.ate < ate);
    $('atualizado').innerHTML = D.meses.map(m => m.coletado ? `${m.mes.split('-').reverse().join('/')}: pedidos até ${m.ate.split('-').reverse().join('/')} (lidos ${new Date(m.atualizado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })})` : `${m.mes.split('-').reverse().join('/')}: ainda não lido`).join(' · ')
        + (falta.length || velho.length ? ' · <b style="color:#ff9f0a">clique em "Atualizar do Mercado Livre" para trazer os pedidos que faltam</b>' : '');
    for (const [id, k, txt] of [['fStatus', 'status', 'Todos os status'], ['fEnvio', 'shippingMethod', 'Todos os envios']]) { const v = $(id).value; $(id).innerHTML = `<option value="">${txt}</option>` + [...new Set(D.pedidos.map(p => p[k]))].sort().map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join(''); }
    if (document.activeElement !== $('cfgBrinde')) $('cfgBrinde').value = D.brinde || ''; if (document.activeElement !== $('cfgEmb')) $('cfgEmb').value = D.embalagem || '';
    colunasFiscais(); pagina = 1; desenharSimulacao(); desenhar(); acompanhar(); verBase(); if (!$('cfgFiscal').hidden) desenharFiscal();
}
function filtrados() {
    const q = ($('busca').value || '').trim().toLowerCase(), c = $('campo').value;
    let L = D.pedidos;
    const fs = $('fStatus').value, fe = $('fEnvio').value;
    if (fs) L = L.filter(p => p.status === fs);
    if (fe) L = L.filter(p => p.shippingMethod === fe);
    if (q) L = L.filter(p => c === 'sku' ? p.products.some(x => String(x.sku).toLowerCase().includes(q)) : c === 'productName' ? p.products.some(x => String(x.nome).toLowerCase().includes(q))
        : [p.requestNumberEcommerce, p.city, p.state, p.status, p.shippingMethod, ...p.products.map(x => x.sku + ' ' + x.nome)].join(' ').toLowerCase().includes(q));
    const k = ordem.k, s = ordem.desc ? -1 : 1;
    return [...L].sort((a, b) => { const x = k === 'products' ? a.products.length : a[k], y = k === 'products' ? b.products.length : b[k]; return (x == null) - (y == null) || (x > y ? 1 : x < y ? -1 : 0) * s; });
}
function soma(L, k) { return L.reduce((t, p) => t + (Number(p[k]) || 0), 0); }
function cel(p, c) {
    const [k, , tipo, , dest] = c, v = p[k];
    if (k === 'date') return `<td class="t">${new Date(p.date).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>`;
    if (k === 'products') return `<td class="prod">${p.products.map(x => `<div><b>${esc(x.sku || '—')}</b> · ${x.quantidade}× ${esc(String(x.nome).slice(0, 48))}${x.fiscal ? ` <span class="f" title="${esc(x.fiscal.fonte)}${x.fiscal.ncm ? ' · NCM ' + x.fiscal.ncm : ''}">${x.fiscal.monofasico ? 'mono' : 'PIS/COF'}${x.fiscal.st ? ' · ST' : ''}${x.fiscal.importado ? ' · imp.' : ''}</span>` : ''}</div>`).join('')}${p.sem_custo ? '<div class="f" style="color:#ff9f0a">sem custo na planilha</div>' : ''}</td>`;
    if (k === 'status') return `<td class="t"><span class="pill ${v === 'Devolvido' ? 'dev' : ''}">${esc(v)}</span></td>`;
    if (k === 'tax') return `<td class="${v < 0 ? 'neg' : ''}" title="${{ nota: 'Pela NF-e do Olist', estimado: 'Estimado: pedido ainda sem nota no Olist (DAS sobre a base)', simulado: 'Simulação do Lucro Real' }[p.imposto_origem] || ''}">${brl(v)}${p.imposto_origem === 'estimado' ? ' <span class="f">*</span>' : ''}</td>`;
    if (k === 'invoiceNumberWithSerie') return `<td class="t" title="${esc(p.nota_fonte ? 'Nota no ' + p.nota_fonte + (p.nota_situacao ? ' · ' + p.nota_situacao : '') : '')}">${v ? esc(v) : '<span class="f">sem nota</span>'}</td>`;
    if (['debitPis', 'debitCofins', 'debitIcms'].includes(k) && p.debitos_do_das) return `<td class="${v < 0 ? 'neg' : ''}" title="Parte deste imposto dentro do DAS do Simples (o DAS restante — IRPJ, CSLL e CPP — fica na coluna Simples)">${brl(v)}</td>`;
    if (k === 'financialTransfer') return `<td class="dest" title="${p.repasse_do_mp ? 'Líquido que caiu no Mercado Pago' : 'Calculado: total venda + comissão + diferença do frete'}">${brl(v)}${p.repasse_do_mp ? '' : ' <span class="f">*</span>'}</td>`;
    if (tipo === 't') return `<td class="t">${esc(v || '—')}</td>`;
    if (tipo === 'p') return `<td class="${v == null ? '' : v < 0 ? 'neg' : ''}">${pct(v)}</td>`;
    const cls = [dest ? 'dest' : '', k === 'margin' && v != null ? (v < 0 ? 'neg' : 'pos') : v < 0 ? 'neg' : ''].join(' ');
    return `<td class="${cls}">${brl(v)}</td>`;
}
function desenhar() {
    if (!D) return;
    const L = filtrados(), t = D.totais, vis = COLS.filter(c => !ocultas.has(c[0]));
    const base = D.base === 'pedido' ? 'totalSale' : 'valueWithDiscount';
    const mL = L.filter(p => p.margin != null), mSoma = soma(mL, 'margin'), cSoma = soma(mL, 'totalCost'), bSoma = soma(mL, base);
    $('cards').innerHTML = [
        ['Total venda', brl(soma(L, 'totalSale')), `${L.length} pedidos`], ['Margem', brl(mSoma), `${pct(bSoma ? mSoma / bSoma * 100 : null)} da venda · ${pct(cSoma ? mSoma / cSoma * 100 : null)} do custo`],
        ['Valor líquido', brl(soma(L, 'liquidValue')), `comissão ${brl(soma(L, 'commission'))} · dif. frete ${brl(soma(L, 'freightDifference'))}`],
        // como o "Déb. TOTAL" do GeFinance, mais o DAS do Simples (que o GeFinance não calcula)
        ['Impostos', brl(soma(L, 'tax')), (() => { if (D.regime !== 'simples') { const v = soma(L, 'valueWithDiscount') || 1; return `Lucro Real: ${pct(soma(L, 'tax') / v * 100)} da venda · débitos ${brl(soma(L, 'debitTotal'))} − créditos ${brl(soma(L, 'creditTotal'))}`; } const a = Object.entries(D.aliquotas_simples || {}).filter(([, x]) => x); return a.length ? `DAS médio ${pct(L.reduce((t, p) => t + (p.aliquota_das || 0) * (p.valueWithDiscount || 0), 0) / (soma(L, 'valueWithDiscount') || 1))} por SKU · ` + a.map(([m, x]) => `cheio ${String(x.efetiva.toFixed(2)).replace('.', ',')}% em ${m.slice(5)}/${m.slice(2, 4)} (faixa ${x.faixa})`).join(' · ') + ` · PIS/COFINS/ICMS ${brl(soma(L, 'debitTotal'))} + IRPJ/CSLL/CPP ${brl(soma(L, 'simplesDas'))}` : `${String(D.imposto_pct).replace('.', ',')}% (Configurações)`; })()],
    ].map(([a, b, c]) => `<div class="card2"><small>${a}</small><b>${b}</b><span>${c}</span></div>`).join('');
    const ini = (pagina - 1) * POR, fatia = L.slice(ini, ini + POR);
    const tot = vis.map(c => { const [k, , tipo] = c; if (k === 'date') return `<td class="t">Totais</td>`; if (tipo === 't') return `<td class="t">${k === 'products' ? `${mL.length < L.length ? `<span class="f">${L.length - mL.length} sem custo fora da margem</span>` : ''}` : ''}</td>`;
        if (k === 'costPercentage') return `<td>${pct(cSoma ? mSoma / cSoma * 100 : null)}</td>`; if (k === 'salePercentage') return `<td>${pct(bSoma ? mSoma / bSoma * 100 : null)}</td>`;
        const v = k === 'margin' ? mSoma : soma(L, k); return `<td class="${v < 0 ? 'neg' : ''}">${brl(v)}</td>`; }).join('');
    $('tab').innerHTML = `<thead><tr>${vis.map(c => `<th class="${c[2] === 't' ? 't' : ''}" onclick="ordenar('${c[0]}')">${c[1]}${ordem.k === c[0] ? (ordem.desc ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead>
        <tbody><tr class="tot">${tot}</tr>${fatia.map(p => `<tr>${vis.map(c => cel(p, c)).join('')}</tr>`).join('') || `<tr><td class="t" colspan="${vis.length}">Nenhum pedido neste período.</td></tr>`}</tbody>`;
    const pags = Math.max(1, Math.ceil(L.length / POR));
    $('pag').innerHTML = `${L.length ? `${ini + 1}–${Math.min(ini + POR, L.length)} de ${L.length}` : ''} <button class="bt" ${pagina <= 1 ? 'disabled' : ''} onclick="pagina--;desenhar()">‹</button> <span>${pagina} / ${pags}</span> <button class="bt" ${pagina >= pags ? 'disabled' : ''} onclick="pagina++;desenhar()">›</button>`;
}
function ordenar(k) { ordem = { k, desc: ordem.k === k ? !ordem.desc : true }; desenhar(); }
function abrirColunas(ev) {
    ev.stopPropagation(); const el = $('cols'); el.hidden = !el.hidden;
    el.innerHTML = COLS.map(c => `<label><input type="checkbox" ${ocultas.has(c[0]) ? '' : 'checked'} onchange="trocarColuna('${c[0]}', this.checked)"> ${c[1]}</label>`).join('');
}
document.addEventListener('click', (e) => { if (!e.target.closest('#cols')) $('cols').hidden = true; });
function trocarColuna(k, v) { v ? ocultas.delete(k) : ocultas.add(k); try { localStorage.setItem('pa_ocultas4', JSON.stringify([...ocultas])); } catch {} desenhar(); }
function exportar() {
    if (!D) return; const L = filtrados(), vis = COLS.filter(c => !ocultas.has(c[0]));
    const val = (p, c) => { const k = c[0]; if (k === 'products') return p.products.map(x => `${x.sku} x${x.quantidade}`).join(' | '); if (k === 'date') return new Date(p.date).toLocaleString('pt-BR'); const v = p[k]; return typeof v === 'number' ? String(v).replace('.', ',') : (v ?? ''); };
    const csv = [vis.map(c => c[1]).join(';')].concat(L.map(p => vis.map(c => String(val(p, c)).replace(/;/g, ',')).join(';'))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); const [de, ate] = intervalo(); a.download = `planilha_avancada_${de}_a_${ate}.csv`; a.click();
}
async function salvarCustosPedido() {
    await fetch('/api/finance/planilha/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ brinde: $('cfgBrinde').value || 0, embalagem: $('cfgEmb').value || 0 }) });
    carregar();
}
async function verBase() {
    const b = await fetch('/api/finance/base-tributaria').then(x => x.json()).catch(() => null);
    if (!b) return;
    const itens = D ? D.pedidos.flatMap(p => p.products) : [], cob = itens.filter(x => x.fiscal).length;
    $('baseTrib').innerHTML = b.importada
        ? `<i class="bi bi-file-earmark-ruled"></i> Base tributária: <b>${esc(b.info.empresa || '')}</b> · regime na base: ${esc(b.info.regime || '—')} · ${b.skus} SKUs (${b.monofasicos} monofásicos, ${b.com_st} com ST) · elaborada por ${esc(b.info['base elaborada por'] || '—')} · importada ${new Date(b.importado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}${itens.length ? ` · regra oficial em ${cob} de ${itens.length} itens do período` : ''}`
        : '<span style="color:#ff9f0a">Sem a Base tributária do contador: o imposto usa as opções gerais. Importe a planilha no botão "Base tributária".</span>';
    const rc = D && D.regime_conta, sem = D ? (D.config_fiscal || []).filter(x => !x.fiscal).length : 0;
    $('baseTrib').innerHTML += `<br><i class="bi bi-bank"></i> Regime da conta: <b>${rc && rc.regime === 'lucro_real' ? `Lucro Real desde ${rc.desde.split('-').reverse().join('/')}` : 'Simples Nacional'}</b> · <a href="#" onclick="alterarRegime();return false">alterar</a>`
        + ` · <a href="#" onclick="verFiscal();return false"><i class="bi bi-sliders"></i> Configuração fiscal por produto</a>${sem ? ` <b style="color:#ff9f0a">(${sem} SKUs sem regra)</b>` : ''}`;
}
async function alterarRegime() {
    const atual = D && D.regime_conta && D.regime_conta.regime === 'lucro_real' ? D.regime_conta.desde : '';
    const v = prompt('Lucro Real a partir de qual mês? (AAAA-MM, ex.: 2026-10)\nDeixe em branco para voltar ao Simples Nacional.', atual);
    if (v == null) return;
    const body = v.trim() ? { regime: 'lucro_real', desde: v.trim() } : { regime: 'simples' };
    const r = await fetch('/api/finance/planilha/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(x => x.json()).catch(e => ({ erro: e.message }));
    if (r.erro) { alert(r.erro); return; }
    carregar();
}
// configuracao fiscal por produto: cada SKU vendido no periodo e a regra que o imposto usa (sempre da Base tributaria)
function verFiscal() { $('cfgFiscal').hidden = !$('cfgFiscal').hidden; if (!$('cfgFiscal').hidden) desenharFiscal(); }
function desenharFiscal() {
    const L = D.config_fiscal || [], cor = (f) => /^base/.test(f || '') ? '#30D158' : /^NCM/.test(f || '') ? '#0a84ff' : '#ff9f0a';
    const sim = (v) => v == null ? '—' : v ? 'Sim' : 'Não', pc = (v) => v == null ? '—' : String(v).replace('.', ',') + '%';
    const sem = L.filter(x => !x.fiscal);
    $('cfgFiscal').innerHTML = `<div class="card2" style="margin-bottom:12px">
        <small><i class="bi bi-sliders"></i> Configuração fiscal por produto · ${L.length} SKUs no período · <span style="color:#30D158">${L.filter(x => x.fiscal && /^base/.test(x.fonte || '')).length} na Base tributária</span> · <span style="color:#0a84ff">${L.filter(x => x.fiscal && /^NCM/.test(x.fonte || '')).length} pelo NCM</span> · <span style="color:#ff9f0a">${sem.length} sem regra</span>
        ${sem.length ? ` · <a href="#" onclick="buscarNcm();return false">buscar o NCM no Olist</a> <span id="ncmEstado"></span>` : ''}</small>
        <div class="f" style="margin:6px 0">Sem regra: o imposto usa o caso geral (ICMS próprio, PIS/COFINS 1,65% + 7,6% não cumulativo). Para corrigir, o contador inclui o SKU na Base tributária e você importa a planilha de novo.</div>
        <div style="max-height:360px;overflow:auto"><table style="width:100%"><thead><tr><th>SKU</th><th>Produto</th><th>Regra</th><th>NCM</th><th>Origem</th><th>ICMS ST</th><th>Monofásico</th><th>PIS</th><th>COFINS</th><th>Vendido no período</th></tr></thead><tbody>
        ${L.map(x => { const f = x.fiscal || {}; return `<tr><td>${esc(x.sku)}</td><td>${esc((x.nome || '').slice(0, 60))}</td><td style="color:${cor(x.fiscal ? x.fonte : 'sem')}">${esc(x.fiscal ? x.fonte : (x.fonte || 'sem regra'))}</td><td>${esc(x.ncm || '—')}</td><td>${f.origem == null ? '—' : f.origem + (f.importado ? ' (importado)' : '')}</td><td>${sim(f.st)}</td><td>${sim(f.monofasico)}</td><td>${pc(f.pis)}</td><td>${pc(f.cofins)}</td><td>${brl(x.venda)} · ${x.unidades} un.</td></tr>`; }).join('')}
        </tbody></table></div></div>`;
}
async function buscarNcm() {
    const skus = (D.config_fiscal || []).filter(x => !x.fiscal).map(x => x.sku);
    const r = await fetch('/api/finance/fiscal/ncm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ skus }) }).then(x => x.json()).catch(e => ({ erro: e.message }));
    if (!r.ok) { alert(r.erro || 'não deu'); return; }
    const tick = async () => { const e = await fetch('/api/finance/fiscal/ncm/estado').then(x => x.json()).catch(() => null); if (!e) return;
        if ($('ncmEstado')) $('ncmEstado').textContent = e.rodando ? `· lendo ${e.feito} de ${e.total}…` : e.erro ? '· erro: ' + e.erro : '· pronto';
        if (e.rodando) setTimeout(tick, 2000); else carregar(); };
    tick();
}
async function importarBase(inp) {
    const f = inp.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('planilha', f);
    $('baseTrib').textContent = 'Importando a base tributária…';
    const r = await fetch('/api/finance/base-tributaria', { method: 'POST', body: fd }).then(x => x.json()).catch(e => ({ erro: e.message }));
    inp.value = '';
    if (r.erro) { $('baseTrib').innerHTML = `<span style="color:#ff453a">${esc(r.erro)}</span>`; return; }
    carregar();
}
async function atualizar() {
    const [de, ate] = intervalo();
    const r = await fetch('/api/finance/planilha/atualizar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ de, ate }) }).then(x => x.json());
    if (!r.ok) alert(r.erro || 'não deu');
    acompanhar();
}
async function acompanhar() {
    let e; try { e = await fetch('/api/finance/planilha/estado').then(x => x.json()); } catch { return; }
    $('btAtualizar').disabled = e.rodando || e.finance.rodando;
    const fz = e.mes === 'notas' ? e.fiscal : e.finance;
    $('estado').innerHTML = e.rodando || e.finance.rodando ? `<i class="bi bi-hourglass-split"></i> ${e.mes === 'notas' ? 'Notas fiscais no Olist' : `Lendo os pedidos no Mercado Livre${e.mes ? ` (${e.mes.split('-').reverse().join('/')})` : ''}`}: ${esc(fz.etapa || '…')}${fz.total ? ` ${fz.feito} de ${fz.total}` : ''}${fz.aviso ? ` · ${esc(fz.aviso)}` : ''}`
        : e.erro ? `<span style="color:#ff453a">Erro: ${esc(e.erro)}</span>` : e.aviso ? `<span style="color:#ff9f0a">${esc(e.aviso)}</span>` : '';
    clearTimeout(timer);
    if (e.rodando || e.finance.rodando) timer = setTimeout(acompanhar, 3000);
    else if ($('estado').dataset.rodava === '1') { $('estado').dataset.rodava = ''; carregar(); }
    if (e.rodando || e.finance.rodando) $('estado').dataset.rodava = '1';
}
try { const p = localStorage.getItem('pa_periodo'); if (p && p !== 'custom') $('periodo').value = p; } catch {}
carregar();
document.body.classList.add('page-ready');
